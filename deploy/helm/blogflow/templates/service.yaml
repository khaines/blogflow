apiVersion: v1
kind: Service
metadata:
  name: {{ include "blogflow.fullname" . }}
  labels:
    {{- include "blogflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- $opsPort := int (include "blogflow.opsPort" .) }}
    {{- if gt $opsPort 0 }}
    {{- /* Named "metrics" for backward compatibility with existing ServiceMonitor
           selectors; the number comes from service.opsPort (or the deprecated
           service.metricsPort alias). */}}
    - port: {{ $opsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "blogflow.selectorLabels" . | nindent 4 }}
