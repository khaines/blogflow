# BlogFlow default configuration
# Override by placing site.yaml in /data/config/ or setting BLOGFLOW_* env vars

site:
  title: "My Blog"
  description: "A blog powered by BlogFlow"
  base_url: "http://localhost:8080"  # Override in production with your actual HTTPS URL
  language: "en"
  author:
    name: ""
    email: ""

content:
  posts_dir: "posts"
  pages_dir: "pages"
  media_dir: "media"
  posts_per_page: 10
  date_format: "January 2, 2006"
  summary_length: 200

theme:
  name: "default"
  path: ""

server:
  port: 8080
  read_timeout: "5s"
  write_timeout: "10s"
  idle_timeout: "120s"

cache:
  enabled: true
  ttl: "1h"
  max_entries: 1000

sync:
  strategy: "watch"
  webhook:
    path: "/api/webhook"
    allowed_events:
      - push
    # secret: Set via BLOGFLOW_WEBHOOK_SECRET env var (never in YAML files)
    branch_filter: "main"
    # allowed_ips: list of IP addresses/CIDRs permitted to call the webhook endpoint
    # empty = no filtering (all IPs allowed)
    allowed_ips: []
    rate_limit: 10

feed:
  enabled: true
  type: "atom"
  items: 20

# Full-text search (opt-in, server-rendered, no JavaScript required).
# Disabled by default. `enabled` takes effect only at startup/router build;
# toggling it at runtime requires a restart. Other tunables reload with content.
search:
  enabled: false
  max_results: 20          # results per page
  min_query_length: 2      # minimum normalized query runes
  max_query_length: 128    # maximum normalized query runes
  max_query_terms: 32      # maximum unique normalized query terms
  excerpt_length: 200      # excerpt display runes
  max_docs: 10000          # maximum indexed posts
  max_tokens: 2000000      # maximum posting occurrences
  max_index_bytes: 67108864 # logical index budget in bytes (64 MiB)
